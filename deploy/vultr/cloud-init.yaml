#cloud-config
# AEGIS // VULTR — Hardened Ubuntu 24.04 Cloud-Init for Vultr Cloud Compute
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw
  - iptables-persistent

runcmd:
  # Install Docker Engine + gVisor (runsc) MicroVM/User-Space Kernel Runtime
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin runsc
  - runsc install && systemctl reload docker

  # Block Sandbox Container SSRF to Vultr Cloud Instance Metadata (169.254.169.254)
  - iptables -I DOCKER-USER -d 169.254.169.254/32 -j DROP
  - netfilter-persistent save

  # UFW Host Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 4000/tcp
  - ufw allow 4100/tcp
  - ufw --force enable
